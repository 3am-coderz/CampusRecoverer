services:
  # 1. Python Matching Engine (FastAPI + ML)
  - type: web
    name: campus-recoverer-matching
    env: docker
    dockerfilePath: infra/Dockerfile.matching
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: INTERNAL_API_KEY
        generateValue: true

  # 2. Node.js Express Backend API
  - type: web
    name: campus-recoverer-api
    env: docker
    dockerfilePath: infra/Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campus-recoverer-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: HANDOVER_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        fromService:
          type: web
          name: campus-recoverer-matching
          envVarKey: INTERNAL_API_KEY
      - key: MATCHING_SERVICE_URL
        fromService:
          type: web
          name: campus-recoverer-matching
          property: host

  # 3. React Frontend (Web Portal)
  - type: web
    name: campus-recoverer-web
    env: docker
    dockerfilePath: infra/Dockerfile.web
    dockerContext: .
    plan: free

databases:
  # PostgreSQL 16 Database
  - name: campus-recoverer-db
    databaseName: campus_recoverer
    user: postgres
    plan: free
