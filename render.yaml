
services:
  # 1. Python Matching Engine (FastAPI + ML)
  - type: web
    name: campus-recoverer-matching
    env: docker
    dockerfilePath: infra/Dockerfile.matching
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8000
      - key: INTERNAL_API_KEY
        generateValue: true

  # 2. Node.js Express Backend API
  - type: web
    name: campus-recoverer-api
    env: docker
    dockerfilePath: infra/Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: HANDOVER_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        fromService:
          type: web
          name: campus-recoverer-matching
          envVarKey: INTERNAL_API_KEY
      - key: MATCHING_SERVICE_URL
        fromService:
          type: web
          name: campus-recoverer-matching
          property: host

  # 3. React Frontend (Web Portal)
  - type: web
    name: campus-recoverer-web
    env: docker
    dockerfilePath: infra/Dockerfile.web
    dockerContext: .
    plan: free
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: campus-recoverer-api
          property: host
